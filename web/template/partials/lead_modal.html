{{define "lead_modal"}}
<div 
  x-show="leadModalOpen" 
  class="fixed inset-0 z-50 overflow-y-auto"
  aria-labelledby="modal-title" 
  role="dialog" 
  aria-modal="true"
  style="display: none;"
>
  
  <div 
    x-show="leadModalOpen"
    x-transition:enter="ease-out duration-300"
    x-transition:enter-start="opacity-0"
    x-transition:enter-end="opacity-100"
    x-transition:leave="ease-in duration-200"
    x-transition:leave-start="opacity-100"
    x-transition:leave-end="opacity-0"
    @click="leadModalOpen = false"
    class="fixed inset-0 bg-navy-950/80 backdrop-blur-sm transition-opacity"
  ></div>

  <div class="flex min-h-full items-end sm:items-center justify-center p-0 sm:p-4 text-center">
    <div 
      x-show="leadModalOpen"
      x-transition:enter="ease-out duration-300"
      x-transition:enter-start="opacity-0 translate-y-full sm:translate-y-0 sm:scale-95"
      x-transition:enter-end="opacity-100 translate-y-0 sm:scale-100"
      x-transition:leave="ease-in duration-200"
      x-transition:leave-start="opacity-100 translate-y-0 sm:scale-100"
      x-transition:leave-end="opacity-0 translate-y-full sm:translate-y-0 sm:scale-95"
      class="relative transform overflow-hidden rounded-t-3xl sm:rounded-2xl bg-white dark:bg-navy-900 text-left shadow-2xl transition-all w-full sm:max-w-lg border border-slate-200 dark:border-slate-800 max-h-[92vh] sm:max-h-[88vh] flex flex-col"
    >
      
      <div class="bg-navy-950 px-5 sm:px-6 pt-3 pb-4 sm:py-5 text-white flex flex-col border-b border-slate-800 shrink-0">
        
        <div class="w-10 h-1 bg-slate-600 rounded-full mx-auto mb-3 sm:hidden"></div>
        <div class="flex justify-between items-center">
          <div>
            <span class="text-[10px] uppercase font-bold tracking-widest text-amber-400 block">Dharavath Concierge</span>
            <h3 class="text-base sm:text-lg font-extrabold text-white font-serif" x-text="leadModalTitle"></h3>
          </div>
          <button 
            type="button" 
            @click="leadModalOpen = false"
            class="rounded-xl p-2 text-slate-400 hover:text-white hover:bg-slate-800 transition-colors"
            aria-label="Close modal"
          >
            <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        </div>
      </div>

      <div id="lead-modal-response" class="p-5 sm:p-6 overflow-y-auto flex-1 overscroll-contain">
        <form 
          hx-post="/api/leads" 
          hx-target="#lead-modal-response" 
          hx-swap="innerHTML"
          class="space-y-4"
        >
          
          <input type="hidden" name="propertyId" :value="leadPropertyId">
          <input type="hidden" name="propertyTitle" :value="leadPropertyTitle">
          <input type="hidden" name="type" value="advisory_inquiry">

          <div x-show="leadPropertyTitle" class="p-3 bg-amber-500/10 dark:bg-amber-400/10 border border-amber-500/30 rounded-xl text-xs text-navy-950 dark:text-amber-300">
            <span class="font-semibold block text-slate-600 dark:text-slate-300">Inquiring about:</span>
            <span class="font-bold text-amber-800 dark:text-amber-400" x-text="leadPropertyTitle"></span>
          </div>

          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-1">Full Name *</label>
            <input 
              type="text" 
              name="name" 
              required 
              placeholder="e.g. Rahul Verma"
              class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-navy-950 text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-500 text-base sm:text-sm focus:ring-2 focus:ring-amber-500 focus:border-amber-500 outline-none"
            >
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-1">Mobile / WhatsApp *</label>
              <input 
                type="tel" 
                name="phone" 
                required 
                placeholder="+91 98765 43210"
                class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-navy-950 text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-500 text-base sm:text-sm focus:ring-2 focus:ring-amber-500 focus:border-amber-500 outline-none"
              >
            </div>
            <div>
              <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-1">Email Address</label>
              <input 
                type="email" 
                name="email" 
                placeholder="rahul@example.com"
                class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-navy-950 text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-500 text-base sm:text-sm focus:ring-2 focus:ring-amber-500 focus:border-amber-500 outline-none"
              >
            </div>
          </div>

          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-1">Preferred Date / Time</label>
            <input 
              type="text" 
              name="preferredDate" 
              placeholder="e.g. This Saturday Morning, 11 AM"
              class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-navy-950 text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-500 text-base sm:text-sm focus:ring-2 focus:ring-amber-500 focus:border-amber-500 outline-none"
            >
          </div>

          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-1">Special Requirements</label>
            <textarea 
              name="message" 
              rows="2" 
              placeholder="Floor preferences, budget range, loan requirements..."
              class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-navy-950 text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-500 text-base sm:text-sm focus:ring-2 focus:ring-amber-500 focus:border-amber-500 outline-none"
            ></textarea>
          </div>

          <div class="pt-2">
            <button 
              type="submit" 
              class="w-full py-3 px-4 rounded-xl bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-navy-950 font-bold text-xs uppercase tracking-wider shadow-md transition-all active:scale-95"
            >
              Confirm Site Visit / Request Callback
            </button>
            <p class="text-[10px] text-slate-400 dark:text-slate-400 text-center mt-2 flex items-center justify-center gap-1">
              <svg class="w-3 h-3 text-emerald-500" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/></svg>
              <span>Zero spam guarantee. 100% confidential advisory.</span>
            </p>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{{end}}
