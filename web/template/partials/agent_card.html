{{define "agent_card"}}
<div class="bg-white dark:bg-navy-900/95 rounded-2xl border border-slate-200 dark:border-slate-800/80 overflow-hidden shadow-sm hover:shadow-xl dark:shadow-black/40 transition-all duration-300 flex flex-col justify-between p-5 space-y-4">
  <div class="flex gap-4 items-start">
    <img 
      src="{{.Photo}}" 
      alt="{{.Name}}" 
      loading="lazy"
      class="w-20 h-20 sm:w-24 sm:h-24 rounded-2xl object-cover shadow-md border border-slate-100 dark:border-slate-800 shrink-0"
    >
    <div class="space-y-1">
      <span class="inline-block px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-wider bg-navy-900 dark:bg-navy-950 text-amber-400 border border-amber-400/20">
        {{.City}} Desk
      </span>
      <h3 class="text-base sm:text-lg font-bold text-navy-900 dark:text-white leading-tight">
        {{.Name}}
      </h3>
      <p class="text-xs text-slate-500 dark:text-slate-400 font-medium">{{.Role}}</p>
      <p class="text-[11px] text-emerald-700 dark:text-emerald-400 font-mono font-semibold flex items-center gap-1 pt-1">
        <svg class="w-3 h-3 text-emerald-600 dark:text-emerald-400" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/></svg>
        <span>{{.ReraID}}</span>
      </p>
    </div>
  </div>

  <div class="space-y-2 text-xs">
    <div class="p-2.5 bg-slate-50 dark:bg-navy-950/80 rounded-xl border border-slate-100 dark:border-slate-800 space-y-1">
      <div class="flex justify-between text-slate-600 dark:text-slate-300">
        <span class="text-slate-400 dark:text-slate-500">Specialization:</span>
        <span class="font-semibold text-slate-800 dark:text-slate-200 text-right">{{.Specialization}}</span>
      </div>
      <div class="flex justify-between text-slate-600 dark:text-slate-300">
        <span class="text-slate-400 dark:text-slate-500">Experience:</span>
        <span class="font-semibold text-slate-800 dark:text-slate-200">{{.Experience}}</span>
      </div>
      <div class="flex justify-between text-slate-600 dark:text-slate-300">
        <span class="text-slate-400 dark:text-slate-500">Active Listings:</span>
        <span class="font-semibold text-slate-800 dark:text-slate-200">{{.ActiveListings}} Verified</span>
      </div>
    </div>
    <p class="text-[11px] text-slate-500 dark:text-slate-400 line-clamp-2 italic">
      "{{.Bio}}"
    </p>
  </div>

  <div class="grid grid-cols-2 gap-2 pt-2 border-t border-slate-100 dark:border-slate-800">
    <a 
      href="tel:{{.Phone}}" 
      class="w-full py-2.5 px-2 rounded-lg text-xs font-bold bg-navy-900 hover:bg-navy-800 dark:bg-slate-800 dark:hover:bg-slate-700 text-white transition-all text-center flex items-center justify-center gap-1"
    >
      <svg class="w-3.5 h-3.5 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/></svg>
      <span>Direct Call</span>
    </a>
    <a 
      href="{{whatsappURL (printf "Hi %s, I would like to consult you regarding properties in %s." .Name .City)}}" 
      target="_blank" 
      rel="noopener"
      class="w-full py-2.5 px-2 rounded-lg text-xs font-bold bg-emerald-50 hover:bg-emerald-100 dark:bg-emerald-950/40 dark:hover:bg-emerald-900/60 text-emerald-700 dark:text-emerald-400 border border-emerald-300 dark:border-emerald-800/60 transition-all text-center flex items-center justify-center gap-1"
    >
      <span>WhatsApp</span>
    </a>
  </div>
</div>
{{end}}
