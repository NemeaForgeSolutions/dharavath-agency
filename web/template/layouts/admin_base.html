<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script>
    (function() {
      try {
        const stored = localStorage.getItem('dharavath_theme');
        if (stored === 'dark' || (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {}
    })();
  </script>

  <link rel="icon" type="image/svg+xml" href="/static/img/favicon.svg">

  <title>{{if .Title}}{{.Title}} | {{end}}Dharavath Admin Portal</title>
  <meta name="robots" content="noindex, nofollow">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..700&family=Playfair+Display:wght@700;900&family=Plus+Jakarta+Sans:wght@400..800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/static/css/styles.css">

  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <script defer src="https://unpkg.com/alpinejs@3.14.8/dist/cdn.min.js"></script>
</head>

<body 
  x-data="{
    darkMode: false,
    init() {
      this.darkMode = document.documentElement.classList.contains('dark');
    },
    toggleTheme() {
      this.darkMode = !this.darkMode;
      if (this.darkMode) {
        document.documentElement.classList.add('dark');
        localStorage.setItem('dharavath_theme', 'dark');
      } else {
        document.documentElement.classList.remove('dark');
        localStorage.setItem('dharavath_theme', 'light');
      }
    }
  }"
  class="bg-slate-100 dark:bg-navy-950 text-slate-800 dark:text-slate-100 antialiased min-h-screen flex flex-col selection:bg-amber-500 selection:text-navy-950"
>

  <header class="bg-navy-950 text-white border-b border-slate-800 sticky top-0 z-40 shadow-md">
    <div class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16 gap-2">

        <div class="flex items-center gap-2 sm:gap-3 shrink-0">
          <a href="/admin" class="flex items-center gap-2">
            <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-amber-400 to-amber-600 flex items-center justify-center text-navy-950 font-bold text-sm">
              PV
            </div>
            <span class="text-sm sm:text-base font-extrabold font-serif tracking-tight text-white">
              DHARAVATH <span class="text-amber-400">AGENCY</span>
            </span>
          </a>
          <span class="hidden sm:inline px-2 py-0.5 rounded text-[10px] uppercase font-bold tracking-wider bg-amber-500/20 text-amber-400 border border-amber-400/30">
            Admin
          </span>
        </div>

        <nav class="flex items-center gap-1.5 sm:gap-3 text-xs font-semibold overflow-x-auto no-scrollbar">
          <a href="/admin" class="px-2.5 sm:px-3 py-1.5 rounded-lg transition-colors whitespace-nowrap {{if eq .ActivePage "admin-dashboard"}}bg-navy-800 text-amber-400{{else}}text-slate-300 hover:text-white{{end}}">
            <span class="sm:hidden">Inventory</span>
            <span class="hidden sm:inline">Inventory & Leads</span>
          </a>
          <a href="/admin/properties/new" class="px-2.5 sm:px-3 py-1.5 rounded-lg transition-colors whitespace-nowrap {{if eq .ActivePage "admin-new-property"}}bg-navy-800 text-amber-400{{else}}text-slate-300 hover:text-white{{end}}">
            + Add <span class="hidden sm:inline">Property</span>
          </a>
          <a href="/" target="_blank" class="text-slate-400 hover:text-slate-200 transition-colors flex items-center gap-1 px-2 py-1.5 whitespace-nowrap">
            <span class="hidden sm:inline">Live Site</span>
            <svg class="w-3.5 h-3.5 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
          </a>

          <button 
            type="button" 
            @click="toggleTheme()" 
            class="p-2 rounded-xl text-slate-300 hover:text-amber-400 hover:bg-slate-800/80 transition-all border border-slate-700/60" 
            :aria-label="darkMode ? 'Switch to light mode' : 'Switch to dark mode'"
            :title="darkMode ? 'Switch to light mode' : 'Switch to dark mode'"
          >
            
            <svg x-show="darkMode" class="w-4 h-4 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="display: none;">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
            </svg>
            
            <svg x-show="!darkMode" class="w-4 h-4 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
            </svg>
          </button>
        </nav>

      </div>
    </div>
  </header>

  <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
    {{block "content" .}}{{end}}
  </main>

  <footer class="bg-white dark:bg-navy-900 border-t border-slate-200 dark:border-slate-800 py-4 text-center text-xs text-slate-500 dark:text-slate-400">
    <p>© 2026 Dharavath Agency. Enterprise Admin System. Powered by Go, HTMX & Alpine.js.</p>
  </footer>

</body>
</html>
